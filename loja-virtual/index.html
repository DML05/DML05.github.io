<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="bg-primary text-white text-center py-2">
        Jogos a partir de R$30,00
    </div>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">RD games</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs- target="#menu">

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Ofertas</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar produtos...">
                    <button class="btn btn-outline-primary">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://i.ytimg.com/vi/dUy-ZUIdYPQ/maxresdefault.jpg" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://cdn1.epicgames.com/spt-assets/edaff839f0734d16bc89d2ddb1dc9339/steel-magnolia-15owu.jpg"
                        class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://image.api.playstation.com/vulcan/ap/rnd/202311/1717/827d78b1eb9155e1383cc43bafeb4c900eb7157bf8b1a65a.jpg"
                        class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <h2 class="mt-4">Categorias</h2>
        <div class="row g-3">
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">Ação</div>
            </div>
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">RPG</div>
            </div>
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">Mundo Aberto</div>
            </div>
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">Aventura</div>
            </div>
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">Sobrevivência</div>
            </div>
            <div class="col-lg-2 col-4">
                <div class="card text-center p-2">Terror</div>
            </div>

        </div>

        <h2 class="mt-4">Destaques</h2>
        <div class="row g-3">
            <div class="col-lg-3 col-md-6">
                <div class="card h-100">
                    <span class="badge text-bg-danger position-absolute m-2">Promoção</span>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyLXs74DQ0afDhTTU5OtGZZSu-aTbsLOwFrkkmxp4gwInJxVITNvvC9e4&s=10"
                        class="card-img-top" alt="Produto">
                    <div class="card-body">
                        <h5 class="card-title">Produto 1</h5>
                        <p class="card-text">
                            <span class="text-muted text-decoration-line-through">R$ 154,90</span>
                            <strong class="text-danger">R$ 77,45</strong>
                        </p>
                        <button class="btn btn-primary w-100">Adicionar ao carrinho</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card h-100">
                    <span class="badge text-bg-danger position-absolute m-2">Promoção</span>
                    <img src="https://i0.wp.com/cromossomonerd.com.br/wp-content/uploads/2025/08/Silksong.jpg?fit=1600%2C900"
                        class="card-img-top" alt="Produto">
                    <div class="card-body">
                        <h5 class="card-title">Produto 1</h5>
                        <p class="card-text">
                            <span class="text-muted text-decoration-line-through">R$ 59,99</span>
                            <strong class="text-danger">R$29,99</strong>
                        </p>
                        <button class="btn btn-primary w-100">Adicionar ao carrinho</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card h-100">
                    <span class="badge text-bg-danger position-absolute m-2">Promoção</span>
                    <img src="https://img.odcdn.com.br/wp-content/uploads/2020/06/20200611083112.jpg"
                        class="card-img-top" alt="Produto">
                    <div class="card-body">
                        <h5 class="card-title">Produto 1</h5>
                        <p class="card-text">
                            <span class="text-muted text-decoration-line-through">R$ 199,90</span>
                            <strong class="text-danger">R$99,99</strong>
                        </p>
                        <button class="btn btn-primary w-100">Adicionar ao carrinho</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card h-100">
                    <span class="badge text-bg-danger position-absolute m-2">Promoção</span>
                    <img src="https://blog.br.playstation.com/tachyon/sites/4/2021/09/God-of-War-Ragnarok-Featured-image.jpg?resize=1088%2C612&crop_strategy=smart"
                        class="card-img-top" alt="Produto">
                    <div class="card-body">
                        <h5 class="card-title">Produto 1</h5>
                        <p class="card-text">
                            <span class="text-muted text-decoration-line-through">R$ 249,90</span>
                            <strong class="text-danger">R$ 159,99</strong>
                        </p>
                        <button class="btn btn-primary w-100">Adicionar ao carrinho</button>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
